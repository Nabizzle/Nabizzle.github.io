# Your experiences
experiences:
- company:
    name: Case Western Reserve University
    url: "https://engineering.case.edu/ebme/tyler"
    location: Cleveland, Ohio
    # company overview
    overview: CWRU has the best neuroengineering department in the country and a world class faculty at the cutting edge of the neuro technology space.
  positions:
  - designation: Neuroengineering PhD Student
    start: Aug 2017
    end: Oct 2025
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Executed comprehensive study on touch perception and motor functions, employing implanted nerve cuff electrodes and data collection from 5 human participants.
    - Innovated a new metric for evaluating touch perception and migration by integrating machine learning models and conducting complex cluster analysis on a robust dataset collected over 12 years from a cohort of 5 participants.
    - Guided a group of 3 to 7 PhD candidates in formalizing research hypotheses and protocols, ensuring the integrity of theoretical foundations.
    - Research featured in 60 Minutes, National Geographic, and PBS.
    - Programmed custom hardware using Python to communicate between devices, MATLAB to program a neural stimulator, and C++ to minimize race conditions.
    - Managed the in-lab experiments for 5 participants, planned the implant surgery for one participant with a team of clinicians, and assisted in the implant of another 5 participants of various neural stimulation studies.

- company:
    name: Shirley Ryan Ability Lab (Center for Bionic Medicine)
    url: "https://www.sralab.org/"
    location: Chicago, Illinois
    overview: The Shirley Ryan Ability lab is the number one rehab hospital in the country and Todd Kuiken of the Center for Bionic Medicine pioneered Targeted Muscle Reinnervation, a technique that revolutionized prosthesis control.
  positions:
  - designation: Biomedical Engineer I
    start: Jun 2016
    end: Jul 2017
    responsibilities:
    - Programmed an embedded pattern recognition controller of 3 different liner-based EMG interfaces using C as part of a contract with a major prosthesis company which released to the market in 2023.
    - Tested the EMG interface with 3 research participants on a monthly basis to analyze the accuracy of the pattern recognition controller.
    - Created custom electrode harnesses to record EMG locally over muscles on 3 different research participants.
    - Programmed a computer vision system to track research participants separately from researchers in a waking test to automatically trigger walking state changes of an experimental leg prosthesis.
    - Collaborated with a multidisciplinary team of electrical, mechanical, biomedical, and software engineers.

